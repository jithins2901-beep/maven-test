
name: BMI Calculator CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  maven:
    name: Maven Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit Tests
        run: mvn clean test

      - name: Package Project
        run: mvn package

      - name: Dependency Tree
        run: mvn dependency:tree

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: maven
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Secrets
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USER" || { echo "Username secret missing"; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo "Password secret missing"; exit 1; }
          echo "Docker secrets are available"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bmi-calculator:latest
